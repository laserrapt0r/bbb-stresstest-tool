{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bbb-stress.name" . }}
  labels: {{- include "bbb-stress.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    adminToken: {{ required "config.adminToken is required" .Values.config.adminToken | quote }}
    language: {{ .Values.config.language | quote }}
    maxBotsPerRun: {{ .Values.config.maxBotsPerRun }}
    botStartTimeoutSeconds: {{ .Values.config.botStartTimeoutSeconds }}
    publicUrl: {{ default (printf "http://%s.%s.svc:%v" (include "bbb-stress.name" .) .Release.Namespace .Values.service.port) .Values.publicUrl | quote }}
    {{- with .Values.config.prometheusUrl }}
    prometheusUrl: {{ . | quote }}
    {{- end }}
    {{- with .Values.config.grafanaUrl }}
    grafanaUrl: {{ . | quote }}
    {{- end }}
    targets: {{- required "config.targets is required" .Values.config.targets | toYaml | nindent 6 }}
    backend:
      type: kubernetes
      namespace: {{ .Release.Namespace | quote }}
      image: {{ .Values.image.bot | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
      imagePullSecrets: {{ .Values.image.pullSecrets | toJson }}
      nodeSelector: {{ .Values.bots.nodeSelector | toJson }}
      tolerations: {{ .Values.bots.tolerations | toJson }}
      runAsUser: {{ .Values.bots.runAsUser }}
{{- end }}
