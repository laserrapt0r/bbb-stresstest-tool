<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBB Lasttest</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2430;--muted:#5e6b7a;--line:#d9dfe6;--accent:#1f5fbf;--ok:#16794a;--bad:#b3261e;--warn:#9a6200}
@media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1d232b;--text:#e7ebf0;--muted:#9aa6b4;--line:#333c47;--accent:#7ab0ff;--ok:#5fd29c;--bad:#ff8a80;--warn:#f0bd66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 16px}h2{font-size:16px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto}textarea{min-height:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}button.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500}
.pass{color:var(--ok)}.fail{color:var(--bad)}.invalid{color:var(--warn)}.muted{color:var(--muted)}.hidden{display:none}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin:8px 0 0}
</style>
</head>
<body><main>
<div class="row" style="justify-content:space-between"><h1 data-t="BBB Lasttest">BBB Lasttest</h1><label><span data-t="Sprache">Sprache</span><select id="lang" onchange="setLang(this.value)"><option value="de">Deutsch</option><option value="en">English</option></select></label></div>

<section class="card hidden" id="login"><h2 data-t="Anmeldung">Anmeldung</h2>
  <div class="row"><input id="token" type="password" data-t-placeholder="Admin-Token" placeholder="Admin-Token" style="max-width:320px" data-t-aria="Admin-Token" aria-label="Admin-Token"><button class="primary" onclick="login()" data-t="Anmelden">Anmelden</button></div>
</section>

<div id="app" class="hidden">
<section class="card"><h2 data-t="Szenario">Szenario</h2>
  <div class="grid">
    <label><span data-t="Vorlage">Vorlage</span><select id="preset" onchange="applyPreset()"></select></label>
    <label><span data-t="Name">Name</span><input id="name"></label>
    <label><span data-t="Ziel">Ziel</span><select id="target"></select></label>
    <label><span data-t="Sitzungen">Sitzungen</span><input id="meetings" type="number" min="1"></label>
    <label><span data-t="Modus">Modus</span><select id="mode" onchange="toggleMode()"><option value="steps" data-t="Stufen bis zur Grenze">Stufen bis zur Grenze</option><option value="fixed" data-t="Feste Last">Feste Last</option></select></label>
  </div>
  <div class="grid" style="margin-top:12px">
    <label class="stepOnly"><span data-t="Start: Nutzer pro Sitzung">Start: Nutzer pro Sitzung</span><input id="startUsers" type="number" min="1"></label>
    <label class="stepOnly"><span data-t="Schrittweite">Schrittweite</span><input id="stepUsers" type="number" min="1"></label>
    <label class="stepOnly"><span data-t="Maximum">Maximum</span><input id="maxUsers" type="number" min="1"></label>
    <label class="fixedOnly"><span data-t="Nutzer pro Sitzung">Nutzer pro Sitzung</span><input id="usersPerMeeting" type="number" min="1"></label>
    <label><span data-t="Beitritte pro Sekunde">Beitritte pro Sekunde</span><input id="joinPerSecond" type="number" min="0.1" step="0.1"></label>
    <label><span data-t="Messdauer pro Stufe (s)">Messdauer pro Stufe (s)</span><input id="holdSeconds" type="number" min="1"></label>
    <label><span data-t="Einschwingzeit (s)">Einschwingzeit (s)</span><input id="settleSeconds" type="number" min="0"></label>
  </div>

  <h2 style="margin-top:16px" data-t="Rollen">Rollen</h2>
  <div class="scroll"><table><thead><tr><th data-t="Name">Name</th><th data-t="Anzahl">Anzahl</th><th data-t="Rest auffüllen">Rest auffüllen</th><th data-t="Moderator">Moderator</th><th data-t="Audio">Audio</th><th data-t="Stumm">Stumm</th><th data-t="Kamera">Kamera</th><th data-t="Screen">Screen</th><th></th></tr></thead><tbody id="roles"></tbody></table></div>
  <button onclick="addRole()" style="margin-top:8px" data-t="Rolle hinzufügen">Rolle hinzufügen</button>

  <details style="margin-top:16px"><summary data-t="Grenzwerte, Bot-Ressourcen und Meeting-Parameter">Grenzwerte, Bot-Ressourcen und Meeting-Parameter</summary>
    <div class="grid" style="margin-top:12px">
      <label><span data-t="Join-Fehler max. %">Join-Fehler max. %</span><input id="maxJoinFailurePct" type="number" step="0.5"></label>
      <label><span data-t="Join-Dauer P95 max. s">Join-Dauer P95 max. s</span><input id="maxJoinP95Seconds" type="number"></label>
      <label><span data-t="Audio-Verlust max. %">Audio-Verlust max. %</span><input id="maxAudioLossPct" type="number" step="0.5"></label>
      <label><span data-t="Video-Verlust max. %">Video-Verlust max. %</span><input id="maxVideoLossPct" type="number" step="0.5"></label>
      <label><span data-t="Jitter P95 max. ms">Jitter P95 max. ms</span><input id="maxJitterMs" type="number"></label>
      <label><span data-t="RTT P95 max. ms">RTT P95 max. ms</span><input id="maxRttMs" type="number"></label>
      <label><span data-t="Freezes pro Minute je Stream max.">Freezes pro Minute je Stream max.</span><input id="maxFreezesPerMinute" type="number" step="0.5"></label>
      <label><span data-t="Bot-CPU max. %">Bot-CPU max. %</span><input id="maxBotCpuPct" type="number"></label>
      <label><span data-t="Bot-CPU">Bot-CPU</span><input id="botCpu"></label><label><span data-t="Bot-RAM">Bot-RAM</span><input id="botMemory"></label><label><span data-t="Bot /dev/shm">Bot /dev/shm</span><input id="botShm"></label>
    </div>
    <label style="margin-top:12px"><span data-t="Prometheus-Regeln (JSON: name, query, max)">Prometheus-Regeln (JSON: name, query, max)</span><textarea id="prometheus"></textarea></label>
    <label style="margin-top:12px"><span data-t="Parameter für /create (JSON, z. B. {"audioBridge":"bbb-webrtc-sfu"})">Parameter für /create (JSON, z. B. {"audioBridge":"bbb-webrtc-sfu"})</span><textarea id="createParams"></textarea></label>
    <label style="margin-top:12px"><span data-t="Präsentation als Datei (PDF wird beim Anlegen mitgeschickt)">Präsentation als Datei (PDF wird beim Anlegen mitgeschickt)</span><input id="presentationFile" type="file" accept=".pdf,.pptx,.docx,.odp"></label>
    <label style="margin-top:12px"><span data-t="Oder Präsentation als URL (muss vom BBB-Server erreichbar sein, keine private Adresse)">Oder Präsentation als URL (muss vom BBB-Server erreichbar sein, keine private Adresse)</span><input id="presentationUrl"></label>
  </details>

  <div class="row" style="margin-top:16px">
    <button onclick="preflight()" data-t="Prüfen">Prüfen</button><button class="primary" onclick="startRun()" data-t="Test starten">Test starten</button><button onclick="saveScenario()" data-t="Szenario speichern">Szenario speichern</button>
  </div>
  <pre id="scenarioResult"></pre>
</section>

<section class="card" id="liveCard"><h2 data-t="Aktueller Lauf">Aktueller Lauf</h2><div id="live" class="muted"></div></section>
<section class="card"><h2 data-t="Ergebnisse">Ergebnisse</h2><div id="runs" class="scroll"></div></section>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('token') || '';
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const en = {
  'BBB Lasttest':'BBB load test','Sprache':'Language','Anmeldung':'Sign in','Anmelden':'Sign in','Szenario':'Scenario','Vorlage':'Template','Name':'Name','Ziel':'Target','Sitzungen':'Meetings','Modus':'Mode',
  'Stufen bis zur Grenze':'Steps up to the limit','Feste Last':'Fixed load','Start: Nutzer pro Sitzung':'Start: users per meeting','Schrittweite':'Step size','Maximum':'Maximum','Nutzer pro Sitzung':'Users per meeting',
  'Beitritte pro Sekunde':'Joins per second','Messdauer pro Stufe (s)':'Measuring time per step (s)','Einschwingzeit (s)':'Settling time (s)','Rollen':'Roles','Anzahl':'Count','Rest auffüllen':'Fill the rest','Moderator':'Moderator',
  'Audio':'Audio','Stumm':'Muted','Kamera':'Camera','Screen':'Screen','Rolle hinzufügen':'Add role','Entfernen':'Remove','Rollenname':'Role name','Screensharing':'Screen sharing','keins':'none','nur hören':'listen only','Mikrofon':'Microphone',
  'Grenzwerte, Bot-Ressourcen und Meeting-Parameter':'Limits, bot resources and meeting parameters','Join-Fehler max. %':'Join failures max. %','Join-Dauer P95 max. s':'Join time P95 max. s','Audio-Verlust max. %':'Audio loss max. %','Video-Verlust max. %':'Video loss max. %',
  'Jitter P95 max. ms':'Jitter P95 max. ms','RTT P95 max. ms':'RTT P95 max. ms','Freezes pro Minute je Stream max.':'Freezes per minute and stream max.','Bot-CPU max. %':'Bot CPU max. %','Bot-CPU':'Bot CPU','Bot-RAM':'Bot RAM','Bot /dev/shm':'Bot /dev/shm',
  'Prometheus-Regeln (JSON: name, query, max)':'Prometheus rules (JSON: name, query, max)','Parameter für /create (JSON, z. B. {"audioBridge":"bbb-webrtc-sfu"})':'Parameters for /create (JSON, e.g. {"audioBridge":"bbb-webrtc-sfu"})',
  'Präsentation als Datei (PDF wird beim Anlegen mitgeschickt)':'Presentation as a file (sent along when creating the meeting)','Oder Präsentation als URL (muss vom BBB-Server erreichbar sein, keine private Adresse)':'Or presentation as URL (must be reachable by the BBB server, no private address)',
  'Prüfen':'Check','Test starten':'Start test','Szenario speichern':'Save scenario','Aktueller Lauf':'Current run','Ergebnisse':'Results','Kein aktiver Lauf':'No active run','Noch keine Läufe':'No runs yet','CSV herunterladen':'Download CSV','Not-Stopp':'Emergency stop',
  'Bereit zum Start':'Ready to start','Nicht startbar':'Cannot start','Stufen':'Steps','Gestartet':'Started','Gespeichert':'Saved','Fehler':'Error','Phase':'Phase','Stufe':'Step','angemeldet':'checked in','stabil bis':'stable up to','Nutzer/Sitzung':'users/meeting',
  'Alle Stufen bestanden':'All steps passed','Grenze gefunden':'Limit found','Ungültig: Bots überlastet':'Invalid: bots overloaded','Abgebrochen':'Aborted','bestanden':'passed','Grenze':'limit','ungültig':'invalid',
  'Ergebnis':'Result','Join-Fehler %':'Join failures %','Join P95 s':'Join P95 s','Audio-Verlust %':'Audio loss %','Video-Verlust %':'Video loss %','Jitter ms':'Jitter ms','RTT ms':'RTT ms','Freezes/min je Stream':'Freezes/min per stream','Bot-CPU %':'Bot CPU %','BBB: Teiln./Video':'BBB: part./video','Medienweg':'Media path','Grund':'Reason',
};
let lang = store.get('lang') || ((navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en');
const T = (s) => (lang === 'en' ? (en[s] ?? s) : s);
function applyLang() {
  document.documentElement.lang = lang; document.title = T('BBB Lasttest'); $('lang').value = lang;
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach((e) => e.setAttribute('aria-label', T(e.dataset.tAria)));
  document.querySelectorAll('[data-t-placeholder]').forEach((e) => { e.placeholder = T(e.dataset.tPlaceholder); });
}
function presetName(s) { return lang === 'en' ? (s.nameEn ?? s.name) : s.name; }
function renderPresets() { const i = $('preset').value; $('preset').innerHTML = presets.map((p, n) => `<option value="${n}">${esc(presetName(p.scenario))}</option>`).join(''); if (i) $('preset').value = i; }
function setLang(next) { lang = next; store.set('lang', lang); applyLang(); renderPresets(); refresh(); }
let presets = [];
let loadedFile = null;
const sloKeys = ['maxJoinFailurePct','maxJoinP95Seconds','maxAudioLossPct','maxVideoLossPct','maxJitterMs','maxRttMs','maxFreezesPerMinute','maxBotCpuPct'];
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { authorization: 'Bearer ' + token, ...(options.body ? { 'content-type': 'application/json' } : {}) } });
  if (res.status === 401) { showLogin(); throw new Error(T('Anmeldung')); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status);
  return body;
}
function showLogin() { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); }
async function login() { token = $('token').value; sessionStorage.setItem('token', token); await init(); }

function addRole(r = { name: 'rolle', count: 1, audio: 'listen' }) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input data-k="name" data-t-aria="Rollenname" aria-label="Rollenname" value="${esc(r.name)}"></td>
    <td><input data-k="count" data-t-aria="Anzahl" aria-label="Anzahl" type="number" min="1" style="width:80px" value="${esc(r.count ?? '')}"></td>
    <td><input data-k="fill" data-t-aria="Rest auffüllen" aria-label="Rest auffüllen" type="checkbox" ${r.fill ? 'checked' : ''}></td>
    <td><input data-k="moderator" data-t-aria="Moderator" aria-label="Moderator" type="checkbox" ${r.moderator ? 'checked' : ''}></td>
    <td><select data-k="audio" data-t-aria="Audio" aria-label="Audio">${['none','listen','microphone'].map((a) => `<option value="${a}" ${r.audio === a ? 'selected' : ''} data-t="${{none:'keins',listen:'nur hören',microphone:'Mikrofon'}[a]}"></option>`).join('')}</select></td>
    <td><input data-k="muted" data-t-aria="Stumm" aria-label="Stumm" type="checkbox" ${r.muted ? 'checked' : ''}></td>
    <td><input data-k="webcam" data-t-aria="Kamera" aria-label="Kamera" type="checkbox" ${r.webcam ? 'checked' : ''}></td>
    <td><input data-k="screenshare" data-t-aria="Screensharing" aria-label="Screensharing" type="checkbox" ${r.screenshare ? 'checked' : ''}></td>
    <td><button onclick="this.closest('tr').remove()" data-t="Entfernen"></button></td>`;
  tr.dataset.slide = r.nextSlideEverySeconds ?? '';
  $('roles').append(tr); applyLang();
}
function toggleMode() {
  const fixed = $('mode').value === 'fixed';
  document.querySelectorAll('.stepOnly').forEach((e) => e.classList.toggle('hidden', fixed));
  document.querySelectorAll('.fixedOnly').forEach((e) => e.classList.toggle('hidden', !fixed));
}
function fill(s) {
  $('name').value = presetName(s); $('meetings').value = s.meetings; $('mode').value = s.load.mode;
  if ([...$('target').options].some((o) => o.value === s.target)) $('target').value = s.target;
  for (const k of ['startUsers','stepUsers','maxUsers','usersPerMeeting','joinPerSecond','holdSeconds','settleSeconds']) $(k).value = s.load[k] ?? '';
  for (const k of sloKeys) $(k).value = s.slo[k];
  $('botCpu').value = s.bot.cpu; $('botMemory').value = s.bot.memory; $('botShm').value = s.bot.shmSize;
  $('prometheus').value = JSON.stringify(s.slo.prometheus);
  $('createParams').value = JSON.stringify(s.meeting.createParams);
  $('presentationUrl').value = s.meeting.presentationUrl ?? '';
  $('presentationFile').value = ''; loadedFile = s.meeting.presentationFile ?? null;
  $('roles').replaceChildren(); s.roles.forEach(addRole); toggleMode();
}
function applyPreset() { const p = presets[$('preset').value]; if (p) fill(p.scenario); }
async function presentationFile() {
  const file = $('presentationFile').files[0];
  if (!file) return loadedFile;
  const bytes = new Uint8Array(await file.arrayBuffer());
  let binary = '';
  for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
  return { name: file.name, base64: btoa(binary) };
}
async function collect() {
  const roles = [...$('roles').children].map((tr) => {
    const v = (k) => tr.querySelector(`[data-k=${k}]`);
    const fillRole = v('fill').checked;
    return { name: v('name').value, ...(fillRole ? { fill: true } : { count: Number(v('count').value) }), moderator: v('moderator').checked,
      audio: v('audio').value, muted: v('muted').checked, webcam: v('webcam').checked, screenshare: v('screenshare').checked,
      ...(tr.dataset.slide ? { nextSlideEverySeconds: Number(tr.dataset.slide) } : {}) };
  });
  const common = { joinPerSecond: +$('joinPerSecond').value, holdSeconds: +$('holdSeconds').value, settleSeconds: +$('settleSeconds').value };
  const load = $('mode').value === 'fixed' ? { mode: 'fixed', usersPerMeeting: +$('usersPerMeeting').value, ...common }
    : { mode: 'steps', startUsers: +$('startUsers').value, stepUsers: +$('stepUsers').value, maxUsers: +$('maxUsers').value, ...common };
  const slo = Object.fromEntries(sloKeys.map((k) => [k, +$(k).value]));
  slo.prometheus = JSON.parse($('prometheus').value || '[]');
  const presentationUrl = $('presentationUrl').value.trim();
  const file = await presentationFile();
  return { name: $('name').value, target: $('target').value, meetings: +$('meetings').value, roles, load, slo,
    bot: { cpu: $('botCpu').value, memory: $('botMemory').value, shmSize: $('botShm').value },
    meeting: { createParams: JSON.parse($('createParams').value || '{}'), ...(presentationUrl ? { presentationUrl } : {}), ...(file ? { presentationFile: file } : {}) } };
}
async function act(fn) { try { $('scenarioResult').textContent = await fn(); } catch (e) { $('scenarioResult').textContent = T('Fehler') + ': ' + e.message; } }
const preflight = () => act(async () => {
  const r = await api('/api/preflight', { method: 'POST', body: JSON.stringify(await collect()) });
  return [T(r.ok ? 'Bereit zum Start' : 'Nicht startbar'), ...r.problems,
    `Bots: ${r.need.bots}, CPU: ${r.need.cpu} vCPU, RAM: ${r.need.memoryGiB.toFixed(1)} GiB`,
    `${T('Stufen')}: ${r.steps.join(' → ')} ${T('Nutzer/Sitzung')}`, ...r.notes].join('\n');
});
const startRun = () => act(async () => { const r = await api('/api/runs', { method: 'POST', body: JSON.stringify(await collect()) }); refresh(); return T('Gestartet') + ': ' + r.id; });
const saveScenario = () => act(async () => { await api('/api/scenarios', { method: 'PUT', body: JSON.stringify(await collect()) }); return T('Gespeichert'); });
async function stopRun(id) { await api(`/api/runs/${id}/stop`, { method: 'POST' }); refresh(); }
async function downloadCsv(id) {
  const res = await fetch(`/api/runs/${id}/report.csv`, { headers: { authorization: 'Bearer ' + token } });
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = id + '.csv'; a.click();
}
const outcomes = { completed: 'Alle Stufen bestanden', 'limit-found': 'Grenze gefunden', invalid: 'Ungültig: Bots überlastet', aborted: 'Abgebrochen', error: 'Fehler' };
const verdicts = { pass: 'bestanden', fail: 'Grenze', invalid: 'ungültig' };
const headers = ['Nutzer/Sitzung','Ergebnis','Join-Fehler %','Join P95 s','Audio-Verlust %','Video-Verlust %','Jitter ms','RTT ms','Freezes/min je Stream','Bot-CPU %','BBB: Teiln./Video','Medienweg','Grund'];
function stepsTable(run) {
  if (!run.steps.length) return '';
  return `<table><thead><tr>${headers.map((h) => `<th>${esc(T(h))}</th>`).join('')}</tr></thead><tbody>` +
  run.steps.map((s) => `<tr><td>${s.usersPerMeeting}</td><td class="${s.verdict}">${esc(T(verdicts[s.verdict]))}</td><td>${s.joinFailurePct}</td><td>${s.joinP95Seconds ?? '–'}</td><td>${s.audioLossPct}</td><td>${s.videoLossPct}</td><td>${s.jitterP95Ms?.toFixed?.(1) ?? '–'}</td><td>${s.rttP95Ms?.toFixed?.(1) ?? '–'}</td><td>${s.freezesPerMinute}</td><td>${s.botCpuP95Pct ?? '–'}</td><td>${s.meetingInfo.reduce((t,m)=>t+m.participantCount,0)}/${s.meetingInfo.reduce((t,m)=>t+m.videoCount,0)}</td><td>${esc(Object.entries(s.mediaPaths).map(([p,n])=>p+': '+n).join(', '))}</td><td>${esc(s.reasons.join('; '))}</td></tr>`).join('') + '</tbody></table>';
}
async function refresh() {
  const runs = await api('/api/runs').catch(() => null); if (!runs) return;
  const running = runs.find((r) => r.phase !== 'finished');
  if (running) {
    const l = running.live || {};
    $('live').className = '';
    $('live').innerHTML = `<div class="row"><strong>${esc(running.scenario.name)}</strong><button class="danger" onclick="stopRun('${esc(running.id)}')">${esc(T('Not-Stopp'))}</button></div>
      <p>${esc(T('Phase'))}: ${esc(running.phase)}${l.stepPhase ? ' · ' + esc(l.stepPhase) : ''}${l.usersPerMeeting ? ` · ${l.usersPerMeeting} ${esc(T('Nutzer/Sitzung'))}` : ''}${l.stepCount ? ` · ${esc(T('Stufe'))} ${(l.currentStep ?? -1) + 1}/${l.stepCount}` : ''}</p>
      <p>Bots: ${l.registered ?? 0}/${l.expected ?? '?'} ${esc(T('angemeldet'))} · ${esc(Object.entries(l.byState || {}).map(([k,v]) => k + ': ' + v).join(', '))}</p><div class="scroll">${stepsTable(running)}</div>`;
  } else { $('live').className = 'muted'; $('live').textContent = T('Kein aktiver Lauf'); }
  $('runs').innerHTML = runs.filter((r) => r.phase === 'finished').map((r) => `<details><summary>${esc(new Date(r.createdAt).toLocaleString(lang === 'en' ? 'en-GB' : 'de-DE'))} · ${esc(r.scenario.name)} · ${esc(T(outcomes[r.outcome] ?? r.outcome))}${r.capacityUsers ? ` · ${esc(T('stabil bis'))} ${r.capacityUsers} ${esc(T('Nutzer/Sitzung'))}` : ''}</summary>
    ${r.message ? `<p>${esc(r.message)}</p>` : ''}<div class="scroll">${stepsTable(r)}</div><button style="margin-top:8px" onclick="downloadCsv('${esc(r.id)}')">${esc(T('CSV herunterladen'))}</button></details>`).join('') || `<p class="muted">${esc(T('Noch keine Läufe'))}</p>`;
}
async function init() {
  let meta; try { meta = await api('/api/meta'); } catch { showLogin(); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('target').innerHTML = meta.targets.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}${t.viaProxy ? ' (Proxy)' : ''}</option>`).join('');
  presets = await api('/api/scenarios');
  renderPresets();
