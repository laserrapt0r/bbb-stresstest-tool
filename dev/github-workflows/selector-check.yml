name: Selector check

# BBB changes its client between releases. This finds out before the next load test does.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - src/bot/selectors.ts
      - scripts/check-selectors.mjs

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-selectors.mjs
